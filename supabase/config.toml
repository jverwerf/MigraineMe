# Supabase CLI config for MigraineMe (qykflarpibofvffmzghi).
#
# WHY THIS FILE EXISTS. On 2026-08-19 14:54 UTC a bulk `supabase functions
# deploy` ran without --no-verify-jwt. With no config.toml the CLI defaults
# verify_jwt = true, so JWT verification switched ON for garmin-webhook and
# nine cron-called functions. The gateway then answered 401 to every Garmin
# push and to every pg_cron call carrying only x-cron-secret, before the
# function could boot. Garmin data stopped for every connected user for 31
# hours and nothing caught it.
#
# Every function listed below is called by something that cannot present a
# Supabase JWT — an external webhook, or pg_cron sending only x-cron-secret.
# Listing it here pins verify_jwt = false through any deploy, with or without
# the flag. A function NOT listed here defaults to verify_jwt = true, which is
# correct for anything the app calls with a user token.
#
# Adding a new webhook or cron-called function? Add it here in the same commit.
# pipeline-watchdog's edge_auth_gate check will email if you forget.

project_id = "qykflarpibofvffmzghi"

